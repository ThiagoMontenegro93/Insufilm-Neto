name: Claude

# Mencione @claude em uma issue ou comentário para acionar o Claude.
# Ele usa as skills de .claude/skills e o agente de .claude/agents.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Dependências de sistema para o Remotion renderizar vídeo
      - name: Instalar FFmpeg e fontes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - uses: anthropics/claude-code-action@v1
        with:
          # Configure UM destes secrets em Settings > Secrets and variables > Actions
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 60"
